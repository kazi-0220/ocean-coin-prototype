document.querySelector('#reset').onclick=()=>open('重置演示',el=>{text(el,'清除本原型的消息和任务进度，恢复 28 金币。');action(el,'确认重置',()=>{state=structuredClone(initial);save();modal.close();render()})});modal.addEventListener('click',e=>{if(e.target===modal){const r=modal.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)modal.close()}});render();

function celebrate(amount){
 if(document.body.classList.contains('motion-off')||matchMedia('(prefers-reduced-motion: reduce)').matches)return;
 const badge=document.createElement('div');badge.className='reward';badge.textContent='★ +'+amount+' 金币';document.body.append(badge);setTimeout(()=>badge.remove(),1400);
 for(let i=0;i<7;i++){const coin=document.createElement('span');coin.className='reward-coin';coin.textContent='●';const angle=(i/6)*Math.PI;coin.style.setProperty('--dx',Math.cos(angle)*130+'px');coin.style.setProperty('--dy',-50-Math.sin(angle)*110+'px');coin.style.setProperty('--spin',i*55+'deg');document.body.append(coin);setTimeout(()=>coin.remove(),950)}
}
const motionToggle=document.createElement('button');motionToggle.id='motionToggle';motionToggle.setAttribute('aria-pressed','true');
let motionEnabled=localStorage.getItem('ocean-motion')!=='off';
function syncMotion(){const reader=document.querySelector('.journal-penguin');if(reader)reader.src=motionEnabled&&!matchMedia('(prefers-reduced-motion:reduce)').matches?'assets/journal/penguin.webp':'assets/journal/penguin-still.png';const walker=document.querySelector('#taskPenguin');if(walker)walker.src=motionEnabled&&!matchMedia('(prefers-reduced-motion:reduce)').matches?'assets/penguin-walk/walk.webp':'assets/penguin-walk/still.png';document.body.classList.toggle('motion-off',!motionEnabled);motionToggle.textContent=motionEnabled?'动效：开':'动效：关';motionToggle.setAttribute('aria-pressed',String(motionEnabled));const video=document.querySelector('#oceanBackground');if(video)motionEnabled?video.play().catch(()=>{}):video.pause()}
motionToggle.onclick=()=>{motionEnabled=!motionEnabled;localStorage.setItem('ocean-motion',motionEnabled?'on':'off');syncMotion()};document.querySelector('header').insertBefore(motionToggle,document.querySelector('#reset'));syncMotion();
