function buildLesson(kind,step){
 const data=lessonData[kind];let panel=document.querySelector('#currencyLesson');
 if(!panel){panel=document.createElement('section');panel.id='currencyLesson';screen.append(panel)}
 panel.replaceChildren();
 const back=document.createElement('button');back.className='lesson-back';back.textContent='‹';back.setAttribute('aria-label','返回水族馆');back.onclick=closeLesson;panel.append(back);
 const stages=[{type:'teach-basic'},...data.questions.slice(0,3).map((q,i)=>({type:'quiz',question:i})),{type:'teach-rate'},...data.questions.slice(3).map((q,i)=>({type:'quiz',question:i+3}))];
 const stage=stages[step],teaching=stage.type.startsWith('teach');
 const progress=document.createElement('div');progress.className='lesson-progress';progress.innerHTML=stages.map((_,i)=>`<i class="${i<=step?'on':''}"></i>`).join('');panel.append(progress);
 const hero=document.createElement('div');hero.className='lesson-hero';
 const character=document.createElement('img');character.className='lesson-character';character.alt=data.name;character.src=`assets/lessons/${kind}-${step===0?'select':'idle'}.webp`;hero.append(character);
 const symbol=document.createElement('div');symbol.className='lesson-symbol';symbol.textContent=data.symbol;hero.append(symbol);panel.append(hero);
 const question=stage.type==='quiz'?data.questions[stage.question]:null;
 const title=document.createElement('h1');title.className='lesson-title';title.textContent=stage.type==='teach-basic'?`先认识${data.short}`:stage.type==='teach-rate'?'汇率是什么？':stage.question<3?'记忆小挑战':'换算小挑战';panel.append(title);
 const sub=document.createElement('p');sub.className='lesson-sub';sub.textContent=stage.type==='teach-basic'?data.intro:stage.type==='teach-rate'?data.rate:stage.question<3?'看看刚学到的知识记住了吗？':'用刚学到的汇率估算一下';panel.append(sub);
 const card=document.createElement('section');card.className='lesson-card '+(teaching?'knowledge-card':'question-card question-in');panel.append(card);
 if(teaching){
  const h=document.createElement('h2');h.textContent=stage.type==='teach-basic'?'货币小名片':'钱也有交换比例';card.append(h);
  const facts=stage.type==='teach-basic'?[[data.symbol,data.facts[0]],[data.code,data.facts[1]],[data.unitLabel,data.facts[2]]]:[['汇率','两种货币互相交换时的比例，每天可能会有一点变化。'],[data.ratio,`${data.rate.replace('学习示例：','')}。`],['估算','先看有几个外币，再乘以对应的人民币数。']];
  facts.forEach(([label,copy])=>{const fact=document.createElement('div');fact.className='lesson-fact';fact.innerHTML=`<b>${label}</b><span>${copy}</span>`;card.append(fact)});
  const next=document.createElement('button');next.className='lesson-next';next.textContent=stage.type==='teach-basic'?'我学会了，开始闯关':'明白了，开始换算';next.onclick=()=>buildLesson(kind,step+1);card.append(next);
 }else{
  const h=document.createElement('h2');h.textContent=question.title;card.append(h);
  const p=document.createElement('p');p.textContent='选择你认为正确的答案。';card.append(p);
  const options=document.createElement('div');options.className='lesson-options';card.append(options);
  const feedback=document.createElement('div');feedback.className='lesson-feedback';card.append(feedback);
  const last=step===stages.length-1,next=document.createElement('button');next.className='lesson-next';next.textContent=last?'完成学习，回到水族馆':step===3?'继续学习汇率':'下一题';next.hidden=true;next.onclick=()=>last?closeLesson():buildLesson(kind,step+1);
  question.choices.forEach(value=>{const b=document.createElement('button');b.textContent=value;options.append(b);b.onclick=()=>{const correct=value===question.answer;feedback.textContent=correct?(question.explain?`答对啦！${question.explain} ✦`:'答对啦！你已经记住了 ✦'):'再想一想，也可以回忆刚才的知识卡～';if(correct){markKnowledge(kind+':'+question.answer+':'+question.explain);b.classList.add('correct');character.src=`assets/lessons/${kind}-celebrate.webp`;next.hidden=false}}});
  card.append(next);
 }
}
