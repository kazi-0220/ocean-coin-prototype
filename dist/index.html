/* Warm island polish: shared surface, clearer hierarchy, and quiet interaction feedback. */

.auth-hero-glow{background:radial-gradient(circle at 40% 35%,#fffdf2,#f6e8bf 72%)}
.auth-card{border-color:#eee5d7;box-shadow:0 12px 32px rgba(81,60,35,.11)}

function renderTaskList(){
 let tabs=screen.querySelector('.task-tabs');
 if(!tabs){tabs=document.createElement('div');tabs.className='task-tabs';tabs.setAttribute('role','tablist');[['todo','待完成'],['done','已完成']].forEach(([value,title])=>{const b=document.createElement('button');b.textContent=title;b.dataset.value=value;b.setAttribute('role','tab');b.onclick=()=>{if(filter===value)return;filter=value;renderTaskList()};tabs.append(b)});screen.append(tabs)}
 tabs.dataset.selected=filter;tabs.querySelectorAll('button').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.value===filter)));screen.querySelector('.task-list')?.remove();
 const list=document.createElement('div');list.className='task-list';list.setAttribute('role','tabpanel');list.setAttribute('aria-label',filter==='done'?'已完成任务':'待完成任务');screen.append(list);
 const ids=state.tasks.map((status,i)=>i).filter(i=>filter==='done'?state.tasks[i]==='done':state.tasks[i]!=='done');
 if(!ids.length){const empty=document.createElement('div');empty.className='task-empty';const title=document.createElement('strong');title.textContent=filter==='done'?'还没有完成的任务':'任务都完成啦';const p=document.createElement('p');p.textContent=filter==='done'?'任务经家长确认后，会收进这里。':'已完成的任务和金币奖励都在另一页。';const b=document.createElement('button');b.textContent=filter==='done'?'去看看待完成':'查看已完成';b.onclick=()=>{filter=filter==='done'?'todo':'done';renderTaskList()};empty.append(title,p,b);list.append(empty);return}
 ids.forEach(i=>{const card=document.createElement('button');card.className='task-card'+(state.tasks[i]==='done'?' done':'');card.setAttribute('aria-label',names[i]+'，'+(state.tasks[i]==='done'?'已完成，获得':state.tasks[i]==='pending'?'等待家长确认，奖励':'待完成，奖励')+rewards[i]+'金币');const art=document.createElement('img');art.src=assets.tasks;art.alt='';art.style.top='0';art.style.transform='translateY(-'+((730+i*196)/1728*100)+'%)';card.append(art);if(state.tasks[i]!=='todo'){const badge=document.createElement('span');badge.className='task-result';badge.textContent=state.tasks[i]==='done'?'✓ 已获金币':'等待确认';card.append(badge);const note=document.createElement('span');note.className='task-confirmed';note.textContent=state.tasks[i]==='done'?'家长已确认':'已提交给家长';card.append(note)}card.onclick=()=>task(i);list.append(card)});
}

function celebrate(amount){
 if(document.body.classList.contains('motion-off')||matchMedia('(prefers-reduced-motion: reduce)').matches)return;
 const badge=document.createElement('div');badge.className='reward';badge.textContent='★ +'+amount+' 金币';document.body.append(badge);setTimeout(()=>badge.remove(),1400);
 for(let i=0;i<7;i++){const coin=document.createElement('span');coin.className='reward-coin';coin.textContent='●';const angle=(i/6)*Math.PI;coin.style.setProperty('--dx',Math.cos(angle)*130+'px');coin.style.setProperty('--dy',-50-Math.sin(angle)*110+'px');coin.style.setProperty('--spin',i*55+'deg');document.body.append(coin);setTimeout(()=>coin.remove(),950)}
}
const motionToggle=document.createElement('button');motionToggle.id='motionToggle';motionToggle.setAttribute('aria-pressed','true');
let motionEnabled=localStorage.getItem('ocean-motion')!=='off';
function syncMotion(){const reader=document.querySelector('.journal-penguin');if(reader)reader.src=motionEnabled&&!matchMedia('(prefers-reduced-motion:reduce)').matches?'assets/journal/penguin.gif':'assets/journal/penguin-still.png';const walker=document.querySelector('#taskPenguin');if(walker)walker.src=motionEnabled&&!matchMedia('(prefers-reduced-motion:reduce)').matches?'assets/penguin-walk/walk.webp':'assets/penguin-walk/still.png';document.body.classList.toggle('motion-off',!motionEnabled);motionToggle.textContent=motionEnabled?'动效：开':'动效：关';motionToggle.setAttribute('aria-pressed',String(motionEnabled));const video=document.querySelector('#oceanBackground');if(video)motionEnabled?video.play().catch(()=>{}):video.pause()}
motionToggle.onclick=()=>{motionEnabled=!motionEnabled;localStorage.setItem('ocean-motion',motionEnabled?'on':'off');syncMotion()};document.querySelector('header').insertBefore(motionToggle,document.querySelector('#reset'));syncMotion();
